<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#3fa9f5" />
    <title>Aero Arcade — Wireless DS</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // La modalità wireless ha bisogno della memoria condivisa: la pagina deve essere "isolata".
      // Al primo giro registro il service worker che aggiunge le intestazioni e ricarico (al massimo 2 volte).
      if (window.crossOriginIsolated) sessionStorage.removeItem("aero-wl-reload");
      else if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./wireless-sw.js", { scope: "./wireless" }).then(() => navigator.serviceWorker.ready).then(() => {
          const n = +sessionStorage.getItem("aero-wl-reload") || 0;
          if (n < 2) { sessionStorage.setItem("aero-wl-reload", n + 1); location.reload(); }
        });
      }
    </script>
    <script>document.write('<script src="./aero-config.js?v=' + Date.now() + '"><\/script>');</script>
    <script type="module" crossorigin src="./assets/wireless-4Hvpq3ll.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/saves-DQkZi2zx.js">
    <link rel="modulepreload" crossorigin href="./assets/wifi-keys-DQaclY-5.js">
    <link rel="stylesheet" crossorigin href="./assets/saves-B9Jlh9WW.css">
  </head>
  <body class="wireless">
    <div id="app"></div>
  </body>
</html>
