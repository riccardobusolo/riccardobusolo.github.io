<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Controller di gelatina</title>
<!-- Versione per la Home di Aero Arcade: sfondo trasparente, niente pannelli,
     three.js servito dal sito (cartella ../vendor/three, condivisa con le console 3D), nessun font o file esterno. -->
<link rel="preload" href="gel-controller.bin" as="fetch" type="application/octet-stream" crossorigin>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  /* comandi originali: servono al codice, ma nella Home restano nascosti */
  .hidden-ui { display: none; }
</style>
<script>
  // effetti leggeri (PC deboli): meno pixel e niente antialiasing
  window.__gelLite = new URLSearchParams(location.search).get("lite") === "1";
</script>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.module.min.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
<link rel="modulepreload" href="../vendor/three/three.module.min.js">
</head>
<body>
<div id="stage"></div>
<div class="hidden-ui" aria-hidden="true">
  <button id="float"><span>Fluttua</span></button>
  <div id="swatches"></div>
  <input id="stiff" type="range" min="0" max="100" value="60">
  <button id="reset">Ricomincia</button>
</div>
<script>
  // Il controller vive in un iframe trasparente grande quanto la finestra:
  // i clic passano alla pagina sotto, tranne quando il puntatore è sopra il
  // controller (così lo si può afferrare e trascinare ovunque sullo schermo).
  const P = new URLSearchParams(location.search);
  if (P.get("yaw")) window.__gelYaw = parseFloat(P.get("yaw"));
  const POS_X = parseFloat(P.get("x") || "0.7"), POS_Y = parseFloat(P.get("y") || "0.37"), ZOOM = parseFloat(P.get("zoom") || "0.58");
  window.__gelView = (cam) => {
    const W = innerWidth, H = innerHeight;
    cam.zoom = ZOOM * Math.min(1, W / 1100 + 0.25);
    cam.setViewOffset(W, H, -(POS_X - 0.5) * W, (0.5 - POS_Y) * H, W, H);
  };
  // Pareti invisibili sui bordi della finestra: nessun punto della gelatina può
  // uscire dallo schermo (vale anche quando la finestra viene ridimensionata).
  // Ogni punto si proietta sullo schermo; se esce dal bordo lo riporto dentro
  // lungo l'asse destra/su della telecamera e lo faccio rimbalzare un poco.
  const MARGIN = 0.015, BOUNCE = 0.45;
  // niente pavimento invisibile: il "pavimento" è il bordo inferiore della finestra
  window.__gelFloor = -1e9;
  window.__gelWalls = (sim, cam) => {
    const x = sim.x, v = sim.v, n = sim.P;
    const P = cam.projectionMatrix.elements, V = cam.matrixWorldInverse.elements, W = cam.matrixWorld.elements;
    const bx = 1 - MARGIN, by = 1 - MARGIN;
    const rx = W[0], ry = W[1], rz = W[2], ux = W[4], uy = W[5], uz = W[6];
    for (let i = 0; i < n; i++) {
      const k = i * 3, px = x[k], py = x[k + 1], pz = x[k + 2];
      const vx = V[0] * px + V[4] * py + V[8] * pz + V[12];
      const vy = V[1] * px + V[5] * py + V[9] * pz + V[13];
      const vz = V[2] * px + V[6] * py + V[10] * pz + V[14];
      const w = -vz;
      if (w <= 0.01) continue;
      // ndc.x = (P0·vx + P8·vz) / w   ·   ndc.y = (P5·vy + P9·vz) / w
      const nx = (P[0] * vx + P[8] * vz) / w, ny = (P[5] * vy + P[9] * vz) / w;
      let dx = 0, dy = 0;
      if (nx > bx) dx = ((bx * w - P[8] * vz) / P[0]) - vx;
      else if (nx < -bx) dx = ((-bx * w - P[8] * vz) / P[0]) - vx;
      if (ny > by) dy = ((by * w - P[9] * vz) / P[5]) - vy;
      else if (ny < -by) dy = ((-by * w - P[9] * vz) / P[5]) - vy;
      if (!dx && !dy) continue;
      x[k] += rx * dx + ux * dy; x[k + 1] += ry * dx + uy * dy; x[k + 2] += rz * dx + uz * dy;
      if (dx) { const vr = v[k] * rx + v[k + 1] * ry + v[k + 2] * rz; if (vr * dx < 0) { const c = -(1 + BOUNCE) * vr; v[k] += rx * c; v[k + 1] += ry * c; v[k + 2] += rz * c; } }
      if (dy) { const vu = v[k] * ux + v[k + 1] * uy + v[k + 2] * uz; if (vu * dy < 0) { const c = -(1 + BOUNCE) * vu; v[k] += ux * c; v[k + 1] += uy * c; v[k + 2] += uz * c; } }
    }
  };
  const frame = window.frameElement;
  const setCatch = (on) => { if (frame) frame.style.pointerEvents = on ? "auto" : "none"; document.body.style.cursor = on ? "grab" : ""; };
  let dragging = false;
  addEventListener("pointerdown", () => { dragging = true; document.body.style.cursor = "grabbing"; }, true);
  addEventListener("pointerup", (e) => { dragging = false; setCatch(!!window.__gelHit?.(e.clientX, e.clientY)); }, true);
  addEventListener("pointercancel", () => { dragging = false; setCatch(false); }, true);
  addEventListener("pointermove", (e) => {
    if (!dragging && e.buttons === 0 && window.__gelHit && !window.__gelHit(e.clientX, e.clientY)) setCatch(false);
  }, { passive: true });
  addEventListener("pointerleave", () => { if (!dragging) setCatch(false); });
  // La rotellina scorre la pagina della Home
  addEventListener("wheel", (e) => { try { parent.scrollBy({ top: e.deltaY, left: 0 }); } catch {} }, { passive: true });
  // Avvisa la Home quando il controller è disegnato: così compare in dissolvenza
  window.__gelReady = () => requestAnimationFrame(() => requestAnimationFrame(() => {
    try { parent.postMessage({ aero: "gel-ready" }, location.origin); } catch {}
  }));
</script>
<script type="module">
  // stessa versione dell'indirizzo: dopo ogni aggiornamento del sito il browser
  // riscarica il controller invece di usare una copia vecchia in memoria
  const v = new URLSearchParams(location.search).get("v");
  import(v ? `./gel-controller.js?v=${encodeURIComponent(v)}` : "./gel-controller.js").catch((e) => {
    console.error("Controller di gelatina non avviato", e);
    try { parent.postMessage({ aero: "gel-error", message: String(e?.message || e) }, location.origin); } catch {}
  });
</script>
</body>
</html>
