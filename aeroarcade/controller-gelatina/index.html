<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Controller di gelatina</title>
<!-- Versione per la Home di Aero Arcade: sfondo trasparente, niente pannelli,
     three.js servito dal sito (cartella ../vendor/three, condivisa con le console 3D), nessun font o file esterno. -->
<link rel="preload" href="gel-controller.bin" as="fetch" type="application/octet-stream" crossorigin>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  /* comandi originali: servono al codice, ma nella Home restano nascosti */
  .hidden-ui { display: none; }
</style>
<script>
  // effetti leggeri (PC deboli): meno pixel e niente antialiasing
  window.__gelLite = new URLSearchParams(location.search).get("lite") === "1";
</script>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/three.module.min.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
<link rel="modulepreload" href="../vendor/three/three.module.min.js">
</head>
<body>
<div id="stage"></div>
<div class="hidden-ui" aria-hidden="true">
  <button id="float"><span>Fluttua</span></button>
  <div id="swatches"></div>
  <input id="stiff" type="range" min="0" max="100" value="60">
  <button id="reset">Ricomincia</button>
</div>
<script>
  // Il controller vive in un iframe trasparente grande quanto la finestra:
  // i clic passano alla pagina sotto, tranne quando il puntatore è sopra il
  // controller (così lo si può afferrare e trascinare ovunque sullo schermo).
  const P = new URLSearchParams(location.search);
  if (P.get("yaw")) window.__gelYaw = parseFloat(P.get("yaw"));
  const POS_X = parseFloat(P.get("x") || "0.7"), POS_Y = parseFloat(P.get("y") || "0.37"), ZOOM = parseFloat(P.get("zoom") || "0.58");
  window.__gelView = (cam) => {
    const W = innerWidth, H = innerHeight;
    cam.zoom = ZOOM * Math.min(1, W / 1100 + 0.25);
    cam.setViewOffset(W, H, -(POS_X - 0.5) * W, (0.5 - POS_Y) * H, W, H);
  };
  // La stanza: sei pareti vere attorno al controller. Le quattro laterali
  // coincidono esattamente con i bordi della finestra (si ricalcolano a ogni
  // fotogramma dalla telecamera, quindi seguono ogni ridimensionamento); davanti
  // e dietro c'è una profondità fissa. La gelatina ci sbatte contro con i punti
  // della sua superficie: si schiaccia, rimbalza e poi torna a galleggiare.
  const EDGE = 0.996;           // bordo della finestra in coordinate schermo
  const FRONT = 1.5, BACK = 2.2; // quanto può avvicinarsi / allontanarsi
  window.__gelBounce = 0.5;      // quanto rimbalza contro le pareti
  window.__gelFriction = 0.22;   // quanto "striscia" lungo le pareti
  const planes = new Float64Array(24);
  window.__gelPlanes = planes;
  let depth0 = null;
  // punto dello schermo (x, y in -1..1, z: -1 vicino, 1 lontano) → mondo
  const unproject = (cam, x, y, z, out) => {
    const I = cam.projectionMatrixInverse.elements, W = cam.matrixWorld.elements;
    let vx = I[0] * x + I[4] * y + I[8] * z + I[12], vy = I[1] * x + I[5] * y + I[9] * z + I[13];
    let vz = I[2] * x + I[6] * y + I[10] * z + I[14];
    const vw = I[3] * x + I[7] * y + I[11] * z + I[15];
    vx /= vw; vy /= vw; vz /= vw;
    out[0] = W[0] * vx + W[4] * vy + W[8] * vz + W[12];
    out[1] = W[1] * vx + W[5] * vy + W[9] * vz + W[13];
    out[2] = W[2] * vx + W[6] * vy + W[10] * vz + W[14];
    return out;
  };
  const A = [0, 0, 0], B = [0, 0, 0], C = [0, 0, 0], IN = [0, 0, 0];
  // piano passante per A, B, C con la normale rivolta verso il punto IN (dentro la stanza)
  const plane = (k) => {
    const ux = B[0] - A[0], uy = B[1] - A[1], uz = B[2] - A[2], wx = C[0] - A[0], wy = C[1] - A[1], wz = C[2] - A[2];
    let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    let d = nx * A[0] + ny * A[1] + nz * A[2];
    if (nx * IN[0] + ny * IN[1] + nz * IN[2] < d) { nx = -nx; ny = -ny; nz = -nz; d = -d; }
    planes[k * 4] = nx; planes[k * 4 + 1] = ny; planes[k * 4 + 2] = nz; planes[k * 4 + 3] = d;
  };
  window.__gelRoom = (cam, sim) => {
    window.__gelSim = sim; window.__gelCam = cam;
    cam.updateMatrixWorld();
    const W = cam.matrixWorld.elements;
    const ex = W[12], ey = W[13], ez = W[14];
    const fx = -W[8], fy = -W[9], fz = -W[10]; // direzione in cui guarda la telecamera
    // profondità di riferimento: dove galleggia il controller (fissata una volta sola)
    if (depth0 === null) {
      const c = sim.hover?.pos ?? sim.body?.c;
      depth0 = c ? (c[0] - ex) * fx + (c[1] - ey) * fy + (c[2] - ez) * fz : 6.5;
    }
    unproject(cam, 0, 0, 0, IN);
    const e = EDGE;
    // sinistra, destra, sotto, sopra: piani che passano per i bordi dello schermo
    unproject(cam, -e, -e, -1, A); unproject(cam, -e, e, -1, B); unproject(cam, -e, -e, 0.9, C); plane(0);
    unproject(cam, e, -e, -1, A); unproject(cam, e, e, -1, B); unproject(cam, e, -e, 0.9, C); plane(1);
    unproject(cam, -e, -e, -1, A); unproject(cam, e, -e, -1, B); unproject(cam, -e, -e, 0.9, C); plane(2);
    unproject(cam, -e, e, -1, A); unproject(cam, e, e, -1, B); unproject(cam, -e, e, 0.9, C); plane(3);
    // davanti e dietro: perpendicolari allo sguardo
    const dn = depth0 - FRONT, df = depth0 + BACK;
    planes[16] = fx; planes[17] = fy; planes[18] = fz; planes[19] = fx * ex + fy * ey + fz * ez + dn;
    planes[20] = -fx; planes[21] = -fy; planes[22] = -fz; planes[23] = -(fx * ex + fy * ey + fz * ez + df);
  };
  const frame = window.frameElement;
  const setCatch = (on) => { if (frame) frame.style.pointerEvents = on ? "auto" : "none"; document.body.style.cursor = on ? "grab" : ""; };
  let dragging = false;
  addEventListener("pointerdown", () => { dragging = true; document.body.style.cursor = "grabbing"; }, true);
  addEventListener("pointerup", (e) => { dragging = false; setCatch(!!window.__gelHit?.(e.clientX, e.clientY)); }, true);
  addEventListener("pointercancel", () => { dragging = false; setCatch(false); }, true);
  addEventListener("pointermove", (e) => {
    if (!dragging && e.buttons === 0 && window.__gelHit && !window.__gelHit(e.clientX, e.clientY)) setCatch(false);
  }, { passive: true });
  addEventListener("pointerleave", () => { if (!dragging) setCatch(false); });
  // La rotellina scorre la pagina della Home
  addEventListener("wheel", (e) => { try { parent.scrollBy({ top: e.deltaY, left: 0 }); } catch {} }, { passive: true });
  // Avvisa la Home quando il controller è disegnato: così compare in dissolvenza
  window.__gelReady = () => requestAnimationFrame(() => requestAnimationFrame(() => {
    try { parent.postMessage({ aero: "gel-ready" }, location.origin); } catch {}
  }));
</script>
<script type="module">
  // stessa versione dell'indirizzo: dopo ogni aggiornamento del sito il browser
  // riscarica il controller invece di usare una copia vecchia in memoria
  const v = new URLSearchParams(location.search).get("v");
  import(v ? `./gel-controller.js?v=${encodeURIComponent(v)}` : "./gel-controller.js").catch((e) => {
    console.error("Controller di gelatina non avviato", e);
    try { parent.postMessage({ aero: "gel-error", message: String(e?.message || e) }, location.origin); } catch {}
  });
</script>
</body>
</html>
