# Compila melonDS per il browser (due DS collegati) e salva il risultato in dist/
name: Compila melonDS (due DS)
on:
  push:
    branches: [melonds-build]
    paths-ignore: ["dist/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.0
          actions-cache-folder: emsdk-cache
      - name: Configura
        working-directory: wasmelonDS
        run: |
          emcmake cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_SDL=OFF -DBUILD_WASM=OFF -DBUILD_DUO=ON -DENABLE_OGLRENDERER=OFF -DENABLE_JIT=OFF \
            -DENABLE_LTO_RELEASE=OFF -DCMAKE_C_FLAGS="-pthread -msimd128" -DCMAKE_CXX_FLAGS="-pthread -msimd128" 2>&1 | tee ../configure.log
      - name: Compila
        working-directory: wasmelonDS
        run: cmake --build build --target duo -j4 2>&1 | tee ../build.log
      - name: ROM di prova (homebrew NiFi, due DS che si mandano il tocco)
        continue-on-error: true
        run: |
          set +e
          mkdir -p dist/test
          git clone --depth 1 https://github.com/Fewnity/Nintendo-DS-Nifi-Template nifi
          # il template usa la libnds 1.x: provo immagini devkitARM più vecchie finché una compila
          for tag in 20230526 20221115 20220821 20220128 20210726 20200730; do
            echo "=== devkitarm:$tag" >> dist/test/nifi-build.log
            docker run --rm -v "$PWD/nifi:/w" -w /w devkitpro/devkitarm:$tag sh -c "make clean >/dev/null 2>&1; make" >> dist/test/nifi-build.log 2>&1 && ls nifi/*.nds && break
          done
          cp nifi/*.nds dist/test/ 2>/dev/null
          exit 0
      - name: Salva il risultato
        if: always()
        run: |
          mkdir -p dist
          cp configure.log build.log dist/ 2>/dev/null || true
          find wasmelonDS/build -name 'duo.js' -o -name 'duo.wasm' -o -name 'duo.worker.js' | tee dist/files.txt | xargs -r -I{} cp {} dist/
          echo "${GITHUB_SHA} $(date -u +%FT%TZ) ${{ job.status }}" > dist/STATUS.txt
          git config user.name "aero-build"
          git config user.email "aero-build@users.noreply.github.com"
          git add dist
          git commit -m "dist: build ${GITHUB_SHA::7} [skip ci]" || echo "niente da salvare"
          git push
